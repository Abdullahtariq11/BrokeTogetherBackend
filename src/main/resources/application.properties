spring.application.name=BrokeTogether-Backend

# These will now work on both Local Docker, IDE, and Railway
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Mobile app sessions stay signed in for 30 days instead of expiring daily like the web client
jwt.mobile-expiration=${JWT_MOBILE_EXPIRATION:2592000000}

# Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://broketogetherbackend-production.up.railway.app/login/oauth2/code/google

# Apple Sign-In (mobile) — must match the "aud" claim on the identity token,
# i.e. the app's bundle identifier
apple.bundle-id=${APPLE_BUNDLE_ID:com.broketogether.app}

app.frontend-url=${FRONTEND_URL}
# Where mobile-initiated Google OAuth logins get redirected back to (deep link into the app)
app.mobile-redirect-uri=${MOBILE_REDIRECT_URI:broketogether://oauth-callback}

# Trust Railway's reverse proxy headers (required for HTTPS redirect URIs and correct client IP)
server.forward-headers-strategy=native

# Resend email
resend.api-key=${RESEND_API_KEY}
app.from-email=${FROM_EMAIL}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.price-id=${STRIPE_PRICE_ID}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# RevenueCat
revenuecat.webhook-secret=${REVENUECAT_WEBHOOK_SECRET}